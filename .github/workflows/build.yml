
name: Cubie A5E Custom OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ \
            gawk gcc-multilib g++-multilib gettext \
            git libncurses-dev libssl-dev \
            python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select Cubie A5E
        working-directory: openwrt
        run: |
          make defconfig
          echo "OpenWrt source ready"
          echo "Target: sunxi/cortexa53"
          echo "Device: radxa_cubie-a5e"

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: cubie-a5e-firmware
          path: |
            openwrt/bin/targets/sunxi/cortexa53/
          if-no-files-found: error
          retention-days: 7
